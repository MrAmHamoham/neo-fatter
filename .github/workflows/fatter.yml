name: Build, Split, and Commit NeoForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NeoForge version'
        required: true
        default: '21.1.228'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Build and split
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          # Download and build fat installer
          wget "https://maven.neoforged.net/releases/net/neoforged/neoforge/${VERSION}/neoforge-${VERSION}-installer.jar"
          java -jar "neoforge-${VERSION}-installer.jar" --fat --fat-include-minecraft --fat-include-minecraft-libs --fat-include-installer-libs
          
          # Split into 95MB chunks
          mkdir -p "installers/neoforge/${VERSION}"
          split -b 95M "neoforge-${VERSION}-installer-fat.jar" "installers/neoforge/${VERSION}/neoforge-${VERSION}-installer-fat."
          
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add installers/
          git commit -m "Add NeoForge ${{ github.event.inputs.version }} (split) [skip ci]" || echo "No changes to commit"
          git push
