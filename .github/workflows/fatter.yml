name: Create and Commit NeoForge Fat Installer

on:
  workflow_dispatch:
    inputs:
      neoforge_version:
        description: 'NeoForge Version'
        required: true
        default: '21.1.228'

# Required permissions to push to the repository
permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch all history so we can commit
        fetch-depth: 0
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Download NeoForge installer
      run: |
        NEOFORGE_VERSION="${{ github.event.inputs.neoforge_version }}"
        wget "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar"
        
    - name: Generate fat installer
      run: |
        VERSION="${{ github.event.inputs.neoforge_version }}"
        java -jar "neoforge-${VERSION}-installer.jar" \
          --fat \
          --fat-include-minecraft \
          --fat-include-minecraft-libs \
          --fat-include-installer-libs
        
        # Create target directory if it doesn't exist
        mkdir -p installers/neoforge
        
        # Move the fat installer to the repo folder
        mv "neoforge-${VERSION}-installer-fat.jar" "installers/neoforge/neoforge-${VERSION}-offline-installer.jar"
        
    - name: Commit and push the fat installer
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add the new file
        git add installers/neoforge/
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Commit the changes
          git commit -m "Add NeoForge ${{ github.event.inputs.neoforge_version }} offline installer"
          
          # Push to the repository
          git push
          
          echo "Successfully committed and pushed the installer"
        fi
