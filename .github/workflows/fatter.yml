name: Split and Commit NeoForge Installer

on:
  workflow_dispatch:
    inputs:
      neoforge_version:
        description: 'NeoForge Version'
        required: true
        default: '21.1.228'

permissions:
  contents: write

jobs:
  split-and-commit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Download and generate fat installer
      run: |
        VERSION="${{ github.event.inputs.neoforge_version }}"
        wget "https://maven.neoforged.net/releases/net/neoforged/neoforge/${VERSION}/neoforge-${VERSION}-installer.jar"
        
        java -jar "neoforge-${VERSION}-installer.jar" \
          --fat \
          --fat-include-minecraft \
          --fat-include-minecraft-libs \
          --fat-include-installer-libs
        
        mv "neoforge-${VERSION}-installer-fat.jar" "neoforge-${VERSION}.jar"
        
    - name: Split JAR into 95MB chunks
      run: |
        VERSION="${{ github.event.inputs.neoforge_version }}"
        mkdir -p installers/neoforge/${VERSION}/parts
        
        # Split using split command (95MB chunks to stay under 100MB limit)
        split -b 95M "neoforge-${VERSION}.jar" "installers/neoforge/${VERSION}/parts/neoforge-${VERSION}.part."
        
        # Create a manifest file with reassembly instructions
        cat > "installers/neoforge/${VERSION}/reassemble.sh" << 'EOF'
        #!/bin/bash
        VERSION="${{ github.event.inputs.neoforge_version }}"
        echo "Reassembling NeoForge ${VERSION} installer..."
        cat parts/neoforge-${VERSION}.part.* > "neoforge-${VERSION}-offline-installer.jar"
        echo "Done! File: neoforge-${VERSION}-offline-installer.jar"
        EOF
        
        chmod +x "installers/neoforge/${VERSION}/reassemble.sh"
        
        # Create Windows batch file for reassembly
        cat > "installers/neoforge/${VERSION}/reassemble.bat" << 'EOF'
        @echo off
        set VERSION=${{ github.event.inputs.neoforge_version }}
        echo Reassembling NeoForge %VERSION% installer...
        copy /b parts\neoforge-%VERSION%.part.* "neoforge-%VERSION%-offline-installer.jar"
        echo Done! File: neoforge-%VERSION%-offline-installer.jar
        EOF
        
        # Create README with instructions
        cat > "installers/neoforge/${VERSION}/README.md" << 'EOF'
        # NeoForge ${{ github.event.inputs.neoforge_version }} Offline Installer
        
        This installer was split into parts because it exceeds GitHub's 100MB file size limit.
        
        ## How to reassemble:
        
        **On Linux/Mac:**
        ```bash
        chmod +x reassemble.sh
        ./reassemble.sh
