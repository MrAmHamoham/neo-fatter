name: Build Offline NeoForge Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NeoForge version'
        required: true
        default: '21.1.228'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Download & build fat installer
      run: |
        VERSION="${{ github.event.inputs.version }}"
        wget "https://maven.neoforged.net/releases/net/neoforged/neoforge/${VERSION}/neoforge-${VERSION}-installer.jar"
        
        # Build the fat installer (requires internet to download deps)
        java -jar "neoforge-${VERSION}-installer.jar" \
          --fat \
          --fat-include-minecraft \
          --fat-include-minecraft-libs \
          --fat-include-installer-libs
        
        # Rename for clarity
        mv "neoforge-${VERSION}-installer-fat.jar" "neoforge-${VERSION}-OFFLINE-READY.jar"
    
    - name: Upload offline-ready installer
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-offline-installer
        path: neoforge-*-OFFLINE-READY.jar
